<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adaptive Agent Router</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a1a1a;
    background: #fafafa;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  header {
    flex: 0 0 auto;
    padding: 24px 16px 8px;
  }
  #router-title h1 {
    font-size: 3rem;
    font-weight: 900;
    text-transform: uppercase;
    color: #e4712a;
    letter-spacing: 2px;
    margin: 0;
    text-shadow:
        -2px -2px 0 #ffffff,
         1px  1px 0 #3f3e3e,
         2px  2px 0 #323131,
         3px  3px 0 #111010;
  }
  p.sub { color: #666; margin: 4px 0 0; }

  /* ── Chat history (scrollable, grows/shrinks between header + composer) ── */
  #chat-history {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #chat-empty {
    color: #999;
    font-size: 0.9rem;
    text-align: center;
    margin-top: 40px;
  }

  .message {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .query-bubble {
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 10px;
    white-space: pre-wrap;
  }

  .progress-wrap { margin: 8px 0; }
  .progress-label { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
  .progress-track {
    width: 100%;
    height: 8px;
    background: #e8e8e8;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 30%;
    background: #e4712a;
    border-radius: 999px;
    animation: indeterminate 1.1s ease-in-out infinite;
  }
  @keyframes indeterminate {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(330%); }
  }

  .answer-box {
    padding: 12px 14px;
    background: #f7f7f8;
    border-radius: 8px;
    border: 1px solid #eee;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.95rem;
  }
  .message-error { color: #b3261e; font-size: 0.9rem; }

  details.routing-details {
    margin-top: 10px;
  }
  details.routing-details summary {
    cursor: pointer;
    color: #666;
    font-size: 0.85rem;
  }
  .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .label { color: #666; }
  .value { font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .badge.tier-1 { background: #e6f4ea; color: #1e7a34; }
  .badge.tier-2 { background: #fdecea; color: #b3261e; }
  .badge.tier-3 { background: #f3e8fd; color: #6a1b9a; }

  .timing-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.88rem;
    color: #444;
  }
  .timing-block {
    margin-top: 10px;
    padding: 10px 12px;
    background: #f7f7f8;
    border-radius: 8px;
    border: 1px solid #eee;
  }
  .timing-title { font-size: 0.8rem; color: #888; margin-bottom: 4px; }

  .scores-title {
    font-size: 0.8rem;
    color: #888;
    margin: 10px 0 4px;
  }
  pre {
    background: #f4f4f4;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    overflow-x: auto;
    margin: 0;
  }

  /* ── Composer (fixed at bottom, part of flex layout — not position:fixed) ── */
  #composer {
    flex: 0 0 auto;
    border-top: 1px solid #e0e0e0;
    background: #fafafa;
    padding: 12px 16px 18px;
  }
  #composer-box {
    background: white;
    border: 1px solid #ccc;
    border-radius: 14px;
    padding: 10px 12px;
  }
  #query {
    width: 100%;
    min-height: 50px;
    max-height: 160px;
    font-size: 1rem;
    font-family: inherit;
    border: none;
    outline: none;
    resize: none;
    box-sizing: border-box;
    background: transparent;
  }
  .composer-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  #expected-endpoint {
    flex: 1 1 auto;
    min-width: 0;
  }
  select {
    padding: 8px 10px;
    font-size: 0.9rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
    font-family: inherit;
  }
  select:disabled {
    background: #dcdcdc;
    color: #888;
    cursor: not-allowed;
    opacity: 0.85;
  }

  /* ── Mode row (under header title/subtitle) ─────────────────────── */
  .mode-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  .mode-label {
    font-size: 0.85rem;
    color: #666;
    font-weight: 600;
  }
  button {
    padding: 9px 20px;
    font-size: 1rem;
    background: #e4712a;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #000000; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: #999; font-size: 0.78rem; margin-top: 6px; padding-left: 4px; }
</style>
</head>
<body>

<div id="app">

  <header>
    <div id="router-title"><h1>🧭Adaptive Agent Router</h1></div>
    <p class="sub">Type a query, press Enter, get routed + answered.</p>
    <div class="mode-row">
      <label for="mode" class="mode-label">Routing method</label>
      <select id="mode">
        <option value="per_seed">🔴 Cosine sim — every seed</option>
        <option value="single_centroid" selected>🔵 Cosine sim — agent centroid</option>
        <option value="multi_centroid">🟢 Cosine sim — agent centroids (k-means)</option>
        <option value="xlmr_classifier">🟣 XLM-R classifier (local model)</option>
      </select>
    </div>
  </header>

  <div id="chat-history">
    <div id="chat-empty">No queries yet — ask something below.</div>
  </div>

  <div id="composer">
    <div id="composer-box">
      <textarea id="query" placeholder="e.g. Write a Python function to parse CSV files"></textarea>
      <div class="composer-controls">
        <select id="expected-endpoint">
          <option value="" selected>No expectation</option>
          <option value="general_assistant">General Assistant</option>
          <option value="code_agent">Code Agent</option>
          <option value="translation_agent">Translation / Multilingual Agent</option>
          <option value="research_agent">Research &amp; Long-document Agent</option>
          <option value="reasoning_agent">Reasoning Agent</option>
          <option value="vision_agent">Vision / OCR Agent</option>
          <option value="image_generation_agent">Image Generation Agent</option>
          <option value="creative_writing_agent">Creative Writing Agent</option>
        </select>
        <button id="submit">Route Query</button>
      </div>
    </div>
    <div class="hint">Press Enter to send · Shift+Enter for a new line</div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  BACKEND API URL — EDIT THIS BEFORE EVERY DEPLOY
// ══════════════════════════════════════════════════════════════════════
// Paste your current tunnel URL here (e.g. from `ngrok http 8000`), with
// no trailing slash. Example: "https://abcd-1234-5678.ngrok-free.app"
// ══════════════════════════════════════════════════════════════════════
//  BACKEND API URL — EDIT THIS BEFORE EVERY DEPLOY
// ══════════════════════════════════════════════════════════════════════
// For LOCAL testing (visiting http://localhost:8000 directly, served by
// FastAPI itself), leave this as "" — same-origin relative requests,
// no tunnel needed. Before deploying to a SEPARATE static host, change
// this to your tunnel/pod URL, e.g. "https://abcd-1234.ngrok-free.app"
// or "https://your-pod-id-8000.proxy.runpod.net" (no trailing slash).
const API_BASE_URL = "";
// ══════════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════

const submitBtn = document.getElementById('submit');
const queryBox = document.getElementById('query');
const modeSelect = document.getElementById('mode');
const expectedEndpointSelect = document.getElementById('expected-endpoint');
const chatHistory = document.getElementById('chat-history');
const chatEmpty = document.getElementById('chat-empty');

let isSubmitting = false;

if (API_BASE_URL.includes("YOUR-TUNNEL-URL-HERE")) {
  chatEmpty.textContent = "⚠️ API_BASE_URL is not set — edit the constant near the top of the <script> tag in this file, then reload.";
  chatEmpty.style.color = "#b3261e";
  submitBtn.disabled = true;
}

function scrollToBottom() {
  chatHistory.scrollTop = chatHistory.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function buildMessageEl(queryText) {
  const el = document.createElement('div');
  el.className = 'message';
  el.innerHTML = `
    <div class="query-bubble">${escapeHtml(queryText)}</div>
    <div class="progress-wrap">
      <div class="progress-label">Routing query and calling the agent endpoint...</div>
      <div class="progress-track"><div class="progress-bar"></div></div>
    </div>
  `;
  return el;
}

function renderResult(el, data, roundTripMs) {
  el.querySelector('.progress-wrap').remove();

  const answerDiv = document.createElement('div');
  answerDiv.className = 'answer-box';
  answerDiv.textContent = data.answer;
  el.appendChild(answerDiv);

  const details = document.createElement('details');
  details.className = 'routing-details';
  details.innerHTML = `
    <summary>Routing details &amp; timing</summary>
    <div class="row"><span class="label">Routed to</span><span class="value">${escapeHtml(data.capability)}</span></div>
    <div class="row"><span class="label">Tier</span><span class="value"><span class="badge tier-${data.tier}">${escapeHtml(data.tier_label)}</span></span></div>
    <div class="row"><span class="label">Model</span><span class="value">${escapeHtml(data.model)}</span></div>
    <div class="row"><span class="label">Confidence</span><span class="value">${data.confident}</span></div>
    <div class="row"><span class="label">Seed appended</span><span class="value">${data.seed_appended ? 'yes' : 'no'}</span></div>

    <div class="timing-block">
      <div class="timing-title">Timing breakdown</div>
      <div class="timing-row"><span>Routing (embed + score/decide)</span><span>${data.routing_time_ms} ms</span></div>
      <div class="timing-row"><span>Endpoint call (agent generation)</span><span>${data.generation_time_ms} ms</span></div>
      <div class="timing-row"><strong><span>Total</span></strong><strong><span>${data.total_time_ms} ms (round-trip incl. network: ${roundTripMs} ms)</span></strong></div>
    </div>

    <div class="scores-title">Semantic scores (all agents)</div>
    <pre>${escapeHtml(JSON.stringify(data.semantic_scores, null, 2))}</pre>
  `;
  el.appendChild(details);
}

function renderError(el, message) {
  el.querySelector('.progress-wrap').remove();
  const errDiv = document.createElement('div');
  errDiv.className = 'message-error';
  errDiv.textContent = `Error: ${message}`;
  el.appendChild(errDiv);
}

async function routeQuery() {
  const query = queryBox.value.trim();
  if (!query || isSubmitting) return;
  const mode = modeSelect.value;

  chatEmpty.style.display = 'none';
  const msgEl = buildMessageEl(query);
  chatHistory.appendChild(msgEl);
  scrollToBottom();

  queryBox.value = '';
  isSubmitting = true;
  submitBtn.disabled = true;
  modeSelect.disabled = true;
  expectedEndpointSelect.disabled = true;

  const clientStart = performance.now();

  try {
    const res = await fetch(`${API_BASE_URL}/api/route`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, mode })
    });

    if (!res.ok) {
      throw new Error(`Server returned ${res.status}`);
    }

    const data = await res.json();

    if (data.error) {
      throw new Error(data.error);
    }

    const roundTripMs = Math.round(performance.now() - clientStart);
    renderResult(msgEl, data, roundTripMs);
  } catch (err) {
    renderError(msgEl, err.message);
  } finally {
    isSubmitting = false;
    submitBtn.disabled = false;
    modeSelect.disabled = false;
    expectedEndpointSelect.disabled = false;
    scrollToBottom();
  }
}

submitBtn.addEventListener('click', routeQuery);

queryBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    routeQuery();
  }
});
</script>

</body>
</html>
